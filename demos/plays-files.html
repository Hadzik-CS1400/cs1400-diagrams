<title>playtest.py Stepper</title>
<!--
  playtest.py Stepper -- CS 1400 Final Project

  Open this file in a browser. Double-click it, or right-click in VS Code ->
  "Reveal in File Explorer" and double-click there. One self-contained file:
  nothing to install, no internet, no extension.

  WHAT IT IS FOR

  It walks playtest.py's OWN code, so a student can see what the tool does
  with the file they wrote. The question behind every "what do I put in
  plays/normal.txt?" is really "what happens to it?", and that is only
  answerable by showing the journey: file -> list -> one long string ->
  stdin -> input() -> a record on stderr -> a dictionary -> the table.

  The code shown IS playtest.py's code, lifted from the file and trimmed of
  its comments. Anything paraphrased would teach a tool that does not exist.

  Five stages, one per step of that journey:
    1  build_answers    your file becomes 4000 keystrokes
    2  the RUNNER       input() is replaced, and writes down what it answered
    3  split_records    the records are separated from a traceback
    4  run_all          twelve runs accumulate into one dictionary
    5  coverage         the dictionary becomes the table

  Everything is deliberately plain: no libraries, no build step, no fetch().
  It has to work from a file:// URL on a Chromebook.
-->
<style>

</style>

<body>

<h1>What <span class="mono">playtest.py</span> does with your file</h1>
<p class="sub">
  This is <span class="mono">playtest.py</span>'s own code, stepped one line at
  a time, so you can follow the journey your answers file takes.
  Use <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> at any time.
</p>

<div class="tabs" id="tabs" role="group" aria-label="Choose a stage"></div>

<div class="why" id="why"></div>

<div class="ctrls">
  <button id="back" type="button">&larr; Back</button>
  <button id="next" type="button">Next &rarr;</button>
  <span class="count" id="count"></span>
</div>

<div class="stage" id="stage" tabindex="0" aria-live="polite"></div>

<script>
/* ------------------------------------------------------------------ *
 * The stages.
 *
 * `code` is playtest.py's real source with its comments trimmed. `vars`
 * on a step is the state AFTER that line has run, and anything named in
 * `fresh` changed on this step, so the eye goes to it.
 * ------------------------------------------------------------------ */

var DEMOS = {
  build: {
    num: "Stage 1",
    name: "build_answers()",
    why: "Your file is read into a list, <strong>repeated</strong> until it is 4000 answers long, then joined into one long string. That string is what gets typed at your program &mdash; the file is not read a line at a time as your program asks; it becomes keystrokes up front.",
    code: [
      "def build_answers(script, player, difficulty):",
      "    with open(script, encoding='utf-8') as answers_file:",
      "        choices = [line.strip() for line in answers_file",
      "                   if line.strip() != '']",
      "    if not choices:",
      "        die(f'{script.name} is empty.')",
      "    answers = [a for a in (player, difficulty) if a]",
      "    while len(answers) < MAX_ANSWERS:",
      "        answers.extend(choices)",
      "    return '\\n'.join(answers[:MAX_ANSWERS]) + '\\n'"
    ],
    steps: [
      {line: 2, vars: {"script": "plays/normal.txt"}, fresh: ["script"],
       note: "The file you wrote is opened. There is nothing special about it &mdash; it is a text file."},
      {line: 3, vars: {"script": "plays/normal.txt", "choices": "['1', '', '6']"}, fresh: ["choices"],
       note: "Every line becomes one list item. The blank line is still here, for one more line."},
      {line: 4, vars: {"script": "plays/normal.txt", "choices": "['1', '6']"}, fresh: ["choices"],
       note: "<code>if line.strip() != ''</code> drops the blank. <strong>Blank lines are ignored; everything else is kept exactly as you typed it</strong>, which is why there are no comments in a plays file."},
      {line: 7, vars: {"choices": "['1', '6']", "answers": "[]"}, fresh: ["answers"],
       note: "<code>player</code> and <code>difficulty</code> are empty for a final project, so nothing is pushed in ahead of your answers. That is what an empty <code>plays/_player.txt</code> buys you."},
      {line: 9, vars: {"choices": "['1', '6']", "answers": "['1', '6']"}, fresh: ["answers"],
       note: "One pass of the loop appends your whole file."},
      {line: 9, vars: {"choices": "['1', '6']", "answers": "['1', '6', '1', '6']"}, fresh: ["answers"],
       note: "And another. <strong>This is the repeat.</strong> It is not clever: the same list, over and over."},
      {line: 8, vars: {"answers": "['1', '6', '1', '6', ... 4000 of them]"}, fresh: ["answers"],
       note: "It stops at <code>MAX_ANSWERS</code>, which is 4000. A program still asking after 4000 answers is stuck, and playtest says so rather than waiting forever."},
      {line: 10, vars: {"returns": "'1 \\n 6 \\n 1 \\n 6 \\n ...'"}, fresh: ["returns"], done: true,
       note: "Joined with newlines into one string of keystrokes. <strong>Your two-line file just became 4000 answers.</strong>"}
    ]
  },

  runner: {
    num: "Stage 2",
    name: "the RUNNER",
    why: "playtest starts a second Python, and before your program runs it <strong>replaces <code>input</code></strong> with its own function. Your file is never edited, copied or searched &mdash; it is run, and its <code>input()</code> calls happen to reach this instead of a keyboard.",
    code: [
      "import builtins, runpy, sys",
      "echo = len(sys.argv) > 2",
      "_read = builtins.input",
      "def _ask(prompt=''):",
      "    value = _read(prompt)",
      "    sys.stderr.write(MARK + str(prompt).strip()",
      "                     + MARK + value)",
      "    if echo:",
      "        print(ECHO + value)",
      "    return value",
      "builtins.input = _ask",
      "runpy.run_path(sys.argv[1], run_name='__main__')"
    ],
    steps: [
      {line: 3, vars: {"_read": "the real input"}, fresh: ["_read"],
       note: "The real <code>input</code> is saved first. <code>_ask</code> still needs it to do the actual reading."},
      {line: 11, vars: {"_read": "the real input", "builtins.input": "_ask"}, fresh: ["builtins.input"],
       note: "<strong>Every <code>input()</code> in your program is now <code>_ask</code>.</strong> You did not change a line of your code for this to happen."},
      {line: 12, vars: {"builtins.input": "_ask"},
       out: [["sys", "your main.py starts running"]],
       note: "<code>run_name='__main__'</code> means your <code>if __name__ == '__main__':</code> block runs exactly as it does normally."},
      {line: 5, vars: {"prompt": "'Choose: '"}, fresh: ["prompt"],
       out: [["ask", "Choose: "], ["typed", "1"]],
       note: "Your program reached an <code>input()</code>. <code>_read</code> takes the next line of that 4000-answer string from stage 1."},
      {line: 6, vars: {"prompt": "'Choose: '", "value": "'1'", "stderr": "Choose: -> 1"}, fresh: ["stderr"],
       note: "<strong>The prompt and the answer are written down together.</strong> This one line is what makes the coverage table possible on any program at all, without playtest knowing anything about your menus."},
      {line: 10, vars: {"value": "'1'"}, done: true,
       note: "Your program gets <code>'1'</code> back and carries on, none the wiser."}
    ]
  },

  split: {
    num: "Stage 3",
    name: "split_records()",
    why: "The records go to <strong>stderr</strong> so your program's own output on stdout stays untouched. But a crash lands on stderr too, so the two have to be pulled apart &mdash; and the crash has to survive it.",
    code: [
      "def split_records(stderr_text):",
      "    asked, leftover = [], []",
      "    for line in stderr_text.splitlines():",
      "        if line.startswith(RECORD):",
      "            parts = line.split(RECORD)",
      "            if len(parts) >= 3:",
      "                asked.append((parts[1], parts[2]))",
      "                continue",
      "        leftover.append(line)",
      "    return asked, leftover"
    ],
    steps: [
      {line: 2, vars: {"asked": "[]", "leftover": "[]"}, fresh: ["asked", "leftover"],
       out: [["sys", "stderr came back with 4 lines"]],
       note: "Two empty lists: one for our bookkeeping, one for everything else."},
      {line: 7, vars: {"asked": "[('Choose:', '1')]", "leftover": "[]"}, fresh: ["asked"],
       note: "A line starting with the marker is one of ours. It becomes a (question, answer) pair."},
      {line: 7, vars: {"asked": "[('Choose:', '1'), ('Student name:', 'Ada Lovelace')]", "leftover": "[]"}, fresh: ["asked"],
       note: "And the next one."},
      {line: 9, vars: {"asked": "2 pairs", "leftover": "['Traceback (most recent call last):']"}, fresh: ["leftover"],
       out: [["err", "Traceback (most recent call last):"]],
       note: "<strong>Not ours.</strong> It goes into <code>leftover</code> rather than being thrown away."},
      {line: 9, vars: {"asked": "2 pairs", "leftover": "[..., \"KeyError: 'Margaret H.'\"]"}, fresh: ["leftover"],
       out: [["err", "KeyError: 'Margaret H.'"]],
       note: "This is your crash. If <code>leftover</code> were discarded, playtest would report a clean run on a program that died."},
      {line: 10, vars: {"asked": "2 pairs", "leftover": "the traceback"}, done: true,
       note: "Both come back. The pairs feed the coverage table; the leftover is read for the error you get told about."}
    ]
  },

  runall: {
    num: "Stage 4",
    name: "run_all()",
    why: "<code>playtest.py all</code> runs every script several times and keeps <strong>one</strong> dictionary across all of them. Each script is narrow on purpose, so no single one covers your program &mdash; what matters is whether the whole suite leaves a question untried.",
    code: [
      "def run_all(runs, player, levels):",
      "    asked, rows, trouble = {}, [], 0",
      "    for script in available():",
      "        tally = {'crashed': 0, 'stuck': 0, 'jammed': 0, 'ok': 0}",
      "        for i in range(runs):",
      "            stdin = build_answers(PLAYS / script, player,",
      "                                  levels[i % len(levels)])",
      "            state, err = play_once(stdin, asked)",
      "            tally[state] += 1",
      "        rows.append((script, tally, detail))",
      "    coverage(asked, len(rows) * runs)"
    ],
    steps: [
      {line: 2, vars: {"asked": "{}"}, fresh: ["asked"],
       note: "<strong>One</strong> dictionary, created before any script runs. Every run adds into this same one."},
      {line: 3, vars: {"asked": "{}", "script": "'badinput'"}, fresh: ["script"],
       out: [["sys", "badinput  "]],
       note: "<code>available()</code> lists your <code>plays/*.txt</code> alphabetically. Files starting with <code>_</code> are settings, not scripts, so <code>_player.txt</code> is not in here."},
      {line: 8, vars: {"script": "'badinput'", "asked": "{'Choose:': {'3'},\n 'Score (0-100):': {'ninety', '84'}}"},
       fresh: ["asked"], out: [["sys", "badinput  ."]],
       note: "Run 1 done. <code>play_once</code> was handed <code>asked</code>, so it added straight into it."},
      {line: 8, vars: {"script": "'badinput'", "asked": "{'Choose:': {'3'},\n 'Score (0-100):': {'ninety', '84'}}"},
       out: [["sys", "badinput  ......"]],
       note: "Six runs of the same script add <strong>nothing new</strong> &mdash; a set only keeps distinct answers. Repeating a run catches bad luck with <code>random</code>; it does not widen coverage."},
      {line: 8, vars: {"script": "'normal'", "asked": "{'Choose:': {'3', '1', '6'},\n 'Score (0-100):': {'ninety', '84'},\n 'Student name:': {'Ada Lovelace'}}"},
       fresh: ["asked", "script"], out: [["sys", "normal    ......"]],
       note: "A <em>different</em> script is what widens it. <code>Choose:</code> has gained two answers, and a question that <code>badinput</code> never reached has appeared."},
      {line: 11, vars: {"asked": "3 questions"}, done: true,
       note: "One table, built from every run of every script. <code>Student name:</code> still holds a single answer."}
    ]
  },

  coverage: {
    num: "Stage 5",
    name: "coverage()",
    why: "The dictionary becomes the table. It needs no knowledge of your menus, because the keys <em>are</em> your prompts &mdash; captured from your own <code>input()</code> calls back in stage 2.",
    code: [
      "def coverage(asked, runs):",
      "    if not asked:",
      "        return",
      "    say('What the program asked, and what your script answered:')",
      "    for prompt in sorted(asked, key=lambda k: -len(asked[k])):",
      "        answers = sorted(asked[prompt])",
      "        shown = ' '.join(answers[:8])",
      "        thin = len(answers) == 1",
      "        say(prompt, shown, thin)"
    ],
    cov: true,
    steps: [
      {line: 5, vars: {"asked": "3 questions", "runs": "12"},
       note: "Sorted by how many distinct answers each question heard &mdash; <strong>most-tested first</strong>, so the thin ones fall to the bottom, where you will actually look."},
      {line: 6, vars: {"prompt": "'Choose:'", "answers": "['1', '3', '6']", "thin": "False"},
       fresh: ["prompt", "answers"], cover: ["Choose:", "1 3 6", false],
       note: "Three distinct answers. This menu has been exercised."},
      {line: 6, vars: {"prompt": "'Score (0-100):'", "answers": "['84', 'ninety']", "thin": "False"},
       fresh: ["prompt", "answers"], cover: ["Score (0-100):", "84 ninety", false],
       note: "Two: a good one and a bad one. That is what <code>badinput.txt</code> was for."},
      {line: 8, vars: {"prompt": "'Student name:'", "answers": "['Ada Lovelace']", "thin": "True"},
       fresh: ["prompt", "answers", "thin"], cover: ["Student name:", "Ada Lovelace", true], thin: true,
       note: "<code>len(answers) == 1</code>. <strong>Twelve runs, and this question only ever heard one thing</strong> &mdash; so the branch for a name that is not in the book has never run."},
      {line: 9, vars: {"asked": "3 questions"}, done: true, thin: true,
       note: "Nothing crashed and every run finished, and a branch of your program has still never executed. <strong>Add a name that does not exist to one of your scripts.</strong>"}
    ]
  }
};

var ORDER = ["build", "runner", "split", "runall", "coverage"];

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;");
}

/* One pass, first alternative wins, so a keyword inside a string is never
   re-coloured. A colourer, not a parser -- the same approach and the same
   palette as the other steppers in this course. */
var TOKENS = new RegExp([
  "(#.*$)",
  "(\"[^\"]*\"|'[^']*')",
  "\\b(open|print|len|str|sorted|range|append|extend|join|split|strip|" +
    "splitlines|startswith|write|run_path|build_answers|play_once|coverage|" +
    "available|die|say)\\b",
  "\\b(def|for|in|if|not|else|elif|while|return|with|as|import|continue|" +
    "lambda|True|False|None)\\b",
  "\\b(\\d+)\\b"
].join("|"), "g");

function hi(src) {
  return esc(src).replace(TOKENS, function (m, cm, st, fn, kw, nm) {
    if (cm) { return '<span class="cm">' + cm + "</span>"; }
    if (st) { return '<span class="st">' + st + "</span>"; }
    if (fn) { return '<span class="fn">' + fn + "</span>"; }
    if (kw) { return '<span class="kw">' + kw + "</span>"; }
    return '<span class="nm">' + nm + "</span>";
  });
}

var current = ORDER[0];
var at = 0;

var stage = document.getElementById("stage");
var tabs = document.getElementById("tabs");
var why = document.getElementById("why");
var count = document.getElementById("count");
var nextBtn = document.getElementById("next");
var backBtn = document.getElementById("back");

function codePane(demo, step) {
  var rows = demo.code.map(function (line, i) {
    var on = (i + 1) === step.line ? " on" : "";
    return '<div class="' + on.trim() + '"><span class="no">' + (i + 1) +
           "</span>" + hi(line) + "</div>";
  });
  return '<div class="pane"><div class="phead">playtest.py</div>' +
         '<div class="code mono">' + rows.join("") + "</div></div>";
}

function varsPane(step) {
  var names = Object.keys(step.vars || {});
  if (!names.length) { return ""; }
  var fresh = step.fresh || [];
  var rows = names.map(function (n) {
    return '<div class="vrow' + (fresh.indexOf(n) >= 0 ? " fresh" : "") +
           '"><span class="vname">' + esc(n) + '</span><span class="vval">' +
           esc(step.vars[n]) + "</span></div>";
  });
  return '<div class="pane"><div class="phead">what is in memory</div>' +
         '<div class="vars">' + rows.join("") + "</div></div>";
}

function termPane(demo, idx) {
  var out = [];
  for (var s = 0; s <= idx; s++) {
    (demo.steps[s].out || []).forEach(function (pair) {
      if (pair[0] === "ask") { out.push("<div>" + esc(pair[1]) + "</div>"); }
      else if (pair[0] === "typed") {
        out[out.length - 1] = out[out.length - 1].replace(
          "</div>", '<span class="typed">' + esc(pair[1]) + "</span></div>");
      } else if (pair[0] === "err") {
        out.push('<div class="err">' + esc(pair[1]) + "</div>");
      } else { out.push('<div class="sys">' + esc(pair[1]) + "</div>"); }
    });
  }
  if (!out.length) { return ""; }
  return '<div class="pane"><div class="phead">on screen</div>' +
         '<div class="term mono">' + out.join("") + "</div></div>";
}

/* The thin flag is carried in the step rather than guessed from the text.
   An earlier version decided "thin" by looking for a space in the answer
   list, which made "Ada Lovelace" -- one answer, two words -- look like
   two answers, exactly inverting the point of the panel. */
function covPane(demo, idx) {
  var order = [], seen = {};
  for (var s = 0; s <= idx; s++) {
    var c = demo.steps[s].cover;
    if (!c) { continue; }
    if (!(c[0] in seen)) { order.push(c[0]); }
    seen[c[0]] = {answers: c[1], thin: c[2]};
  }
  if (!order.length) { return ""; }
  var rows = order.map(function (q) {
    var r = seen[q];
    return '<tr><td class="mono">' + esc(q) + '</td><td class="mono' +
           (r.thin ? " thin" : "") + '">' + esc(r.answers) +
           (r.thin ? '<span class="tag">only ever this one</span>' : "") +
           "</td></tr>";
  });
  return '<div class="pane"><div class="phead">the table it prints</div>' +
         '<table class="cov"><thead><tr><th>asked</th><th>answered</th>' +
         "</tr></thead><tbody>" + rows.join("") + "</tbody></table></div>";
}

function render() {
  var demo = DEMOS[current];
  var step = demo.steps[at];
  why.innerHTML = "<strong>" + demo.num + " &middot; <code>" + demo.name +
                  "</code></strong> &mdash; " + demo.why;
  stage.innerHTML =
    '<div class="cols"><div>' + codePane(demo, step) + "</div><div>" +
    varsPane(step) + termPane(demo, at) +
    (demo.cov ? covPane(demo, at) : "") + "</div></div>" +
    (step.note ? '<div class="note' + (step.thin ? " warn" : "") + '">' +
     step.note + "</div>" : "");
  count.textContent = "step " + (at + 1) + " of " + demo.steps.length;
  backBtn.disabled = at === 0;
  nextBtn.disabled = at === demo.steps.length - 1;
  Array.prototype.forEach.call(tabs.children, function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.k === current));
  });
}

ORDER.forEach(function (key) {
  var d = DEMOS[key];
  var b = document.createElement("button");
  b.type = "button";
  b.className = "tab";
  b.dataset.k = key;
  b.innerHTML = '<span class="tnum">' + d.num + "</span>" + esc(d.name);
  b.addEventListener("click", function () {
    current = key; at = 0; render(); stage.focus();
  });
  tabs.appendChild(b);
});

nextBtn.addEventListener("click", function () {
  if (at < DEMOS[current].steps.length - 1) { at++; render(); }
});
backBtn.addEventListener("click", function () {
  if (at > 0) { at--; render(); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === "PageDown") {
    if (at < DEMOS[current].steps.length - 1) { at++; render(); }
    e.preventDefault();
  } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
    if (at > 0) { at--; render(); }
    e.preventDefault();
  }
});

render();
</script>
</body>
</html>
